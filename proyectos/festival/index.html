<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montevideo 4 Designers - Primer Encuentro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://use.typekit.net/xad8irm.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body> 

<!-- redes -->
<header class="row pt-4 align-items-center">
    
    <div class="col-8 d-flex justify-content-start">
        </div>
    
    <div class="col-4 d-flex justify-content-end iconos-sociales pe-4">
        
        <a href="https://www.instagram.com/" class="social-icon" aria-label="Instagram" 
        data-aos="fade-left" data-aos-delay="100">
            <i class="fab fa-instagram"></i>
        </a>
        
        <a href="https://www.facebook.com/?locale=es_LA" class="social-icon" aria-label="Facebook" 
        data-aos="fade-left" data-aos-delay="200">
            <i class="fab fa-facebook-f"></i>
        </a>
        
        <a href="https://x.com/?lang=es" class="social-icon" aria-label="Twitter/X" 
        data-aos="fade-left" data-aos-delay="300">
            <i class="fab fa-x-twitter"></i>
        </a>
        
    </div>
</header>
    
<!-- hero -->
    <section class="hero-section">
        <div class="container-fluid pt-5 px-5" style="height: 100%;"> 
            <div class="row">
                

                <div class="col-md-3 d-flex justify-content-center align-items-center">
                    <div class="star-png star-large" data-aos="zoom-in" data-aos-delay="300">
                        <img src="img/estrella.png" alt="Estrella decorativa grande">
                    </div>
                </div>

                <div class="col-md-9 pt-3">
                    <h1 class="text-montevideo" data-aos="fade-up" data-aos-delay="800" data-aos-duration="1000">
                        Montevideo
                    </h1>

                    <h2 class="text-designers" data-aos="fade-up" data-aos-delay="1000" data-aos-duration="1000">
                        4designers
                    </h2>
                </div>
                
                <div class="col-12 text-center pt-5">
                    <a id="btn-leer-mas" class="btn btn-outline-light btn-lg animate-pulse " data-aos="zoom-in" data-aos-delay="1200">
                        leer más
                    </a>
                </div>

                <div class="col-12 text-center pt-5">
                <div class="col-md-8 offset-md-2">
                    <p id="informacion" data-aos="zoom-in" data-aos-delay="1200">
                    Montevideo 4Designers es el primer encuentro presencial de diseñadores gráficos en Montevideo, Uruguay. Un evento único que reúne a creativos de toda la región para compartir conocimientos, experiencias y tendencias en el mundo del diseño.
                </p>
                </div>
                </div>
                
            </div>
        </div>
    </section>

<!-- script -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="codigo.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body> 
</html>
