<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucía Pérez</title>
    <!-- cdn desde la web de bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-md">
      <div class="container-fluid">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbar-toggler"
          aria-controls="navbarTogglerDemo01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar-toggler">
          <ul class="navbar-nav d-flex justify-content-around w-100">
            <li class="nav-item">
              <a href="#about-section">about</a>
            </li>
            <li class="nav-item">
              <a href="#">works</a>
            </li>
            <li class="nav-item">
              <a href="#"
                >contact</a
              >
            </li>
            <li class="nav-item">
              <a href="#">es</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- hero section -->
    <section class="hero-section py-5 d-flex align-items-center">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-12 col-lg-6 text-center text-lg-start">
            <video class="hero-video w-100" autoplay muted loop playsinline>
              <source src="img/yo.webm" type="video/webm" />
              Tu navegador no soporta la etiqueta de video.
            </video>
          </div>

          <div class="col-12 col-lg-6 mt-4 mt-lg-0 text-center text-lg-start">
            <h1 class="display-6" data-aos="fade-down" data-aos-duration="1000">
              hello, I'm Lucía
            </h1>

            <p
              class="lead my-5"
              data-aos="fade-up"
              data-aos-delay="200"
              data-aos-duration="1000"
            >
              an uruguayan <b>digital designer</b> and <b>frontend developer</b>
              creating digital human-centered experiences.
            </p>

            <div
              class="d-flex justify-content-center justify-content-lg-start gap-5"
              data-aos="zoom-in"
              data-aos-delay="400"
            >
              <a href="#" class="btn btn-dark">start exploring</a>
              <a href="im" class="btn btn-outline-dark">download CV</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- about section -->
    <section id="about-section">
      <div class="container h-100 d-flex align-items-center">
        <div class="row w-100 justify-content-center g-0">
          <div
            class="col-12 col-lg-8 text-center"
            data-aos="fade-in"
            data-aos-duration="1500"
            data-aos-once="true"
          >
            <video
              class="about-video img-fluid"
              autoplay
              muted
              loop
              playsinline
            >
              <source src="img/peces_3_2.webm" type="video/mp4" />
              Tu navegador no soporta el video.
            </video>
          </div>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 1200,
        once: true,
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
